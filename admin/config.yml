          - label: No telemóvel, tirar o título de cima da imagem
            name: saiNoTelemovel
            widget: boolean
            default: false
            required: false
            hint: 'Liga só se o enquadramento que escolheste não servir no ecrã estreito'
      - label: Subtítulo
        name: subtitulo
        widget: object
        collapsed: true
        required: false
        summary: '{{fields.pt}}'
        fields:
