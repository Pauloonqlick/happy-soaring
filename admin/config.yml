  - name: avisos
    label: Avisos e ofertas
    label_singular: Aviso
    editor:
      preview: false
    folder: content/avisos
    format: json
    identifier_field: id
    slug: '{{fields.id}}'
    create: true
    summary: '{{fields.nome}}'
    description: 'Faixas e janelas. Depois de criares um, junta-o à lista em Definições gerais — só os que estão lá são carregados.'
    fields:
      - label: Identificador
        name: id
        widget: string
        hint: 'Ex: promo-mullet2-2026. É a chave do "ja vi este". Muda-o quando for outra mensagem, mantém-no quando for só uma correcção'
      - label: Nome (para te orientares)
        name: nome
        widget: string
        required: false
      - label: Ativo
        name: ativo
        widget: boolean
        default: false
        hint: 'O interruptor. Desliga e desaparece do site'
      - label: Começa em
        name: inicio
        widget: string
        required: false
        hint: 'AAAA-MM-DD. Vazio = começa já'
      - label: Acaba em
        name: fim
        widget: string
        required: false
        hint: 'AAAA-MM-DD. Vazio = não acaba. Preenche sempre numa oferta'
      - label: Que asas abrange
        name: abrange
        widget: object
        required: false
        collapsed: false
        hint: 'Quais as asas que levam o selo "Oferta". É coisa diferente do destino dos botões: o botão pode levar à gama toda enquanto a oferta é só de uma asa. Deixar os dois vazios = campanha geral, só a faixa, sem selo em asa nenhuma'
        fields:
          - label: Famílias
            name: familias
            widget: list
            required: false
            field: {label: Família, name: familia, widget: string}
            hint: 'Escreve o nome exacto da família: Parakites, Parapentes, Paramotor, Tandem, Arneses, Reservas'
          - label: Asas
            name: produtos
            widget: list
            required: false
            field: {label: Asa, name: produto, widget: string}
            hint: 'O nome exacto da asa, como está no catálogo. Ex: Mullet 2'
      - label: Tipo
        name: tipo
        widget: select
        default: aviso
        options:
          - {label: Oferta (laranja), value: oferta}
          - {label: Promoção (framboesa), value: promocao}
          - {label: Aviso (amarelo), value: aviso}
          - {label: Novidade (verde), value: novidade}
      - label: Como aparece
        name: forma
        widget: select
        default: faixa
        options:
          - {label: Faixa no topo, value: faixa}
          - {label: Janela, value: janela}
          - {label: Faixa + janela, value: faixa-janela}
      - label: Espera (segundos)
        name: esperaSegundos
        widget: number
        value_type: int
        min: 0
        default: 20
        required: false
        hint: 'Só para a janela. Quanto tempo espera antes de aparecer'
      - label: Volta a aparecer
        name: repetir
        widget: select
        default: sessao
        options:
          - {label: Em cada visita nova, value: sessao}
          - {label: Uma vez e nunca mais, value: nunca}
          - {label: Ao fim de 7 dias, value: '7'}
          - {label: Ao fim de 30 dias, value: '30'}
        hint: 'Na faixa usa "em cada visita" — não tapa nada. Na janela usa "uma vez", senão vira armadilha'
      - label: Prazo na faixa
        name: prazo
        widget: select
        default: data
        options:
          - {label: A data de fim, value: data}
          - {label: Contagem decrescente, value: contagem}
          - {label: Não mostrar, value: nenhum}
        hint: 'Escrito a partir do campo "Acaba em". Assim a data existe num sítio só'
      - label: Mostrar as ofertas na faixa
        name: ofertasNaFaixa
        widget: boolean
        default: true
        required: false
        hint: 'Até três, tiradas dos Pontos. No telemóvel desaparecem para a faixa não virar parede'
      - label: Etiqueta
        name: etiqueta
        widget: object
        collapsed: true
        required: false
        summary: '{{fields.pt}}'
        hint: 'A palavra pequena que aparece no selo. Ex: Oferta, Aviso'
        fields:
          - {label: Português, name: pt, widget: string, required: false}
          - {label: English, name: en, widget: string, required: false}
          - {label: Español, name: es, widget: string, required: false}
          - {label: Français, name: fr, widget: string, required: false}
          - {label: Deutsch, name: de, widget: string, required: false}
      - label: Título
        name: titulo
        widget: object
        collapsed: true
        required: false
        summary: '{{fields.pt}}'
        hint: 'Na janela assenta no canto da imagem'
        fields:
          - {label: Português, name: pt, widget: string, required: false}
          - {label: English, name: en, widget: string, required: false}
          - {label: Español, name: es, widget: string, required: false}
          - {label: Français, name: fr, widget: string, required: false}
          - {label: Deutsch, name: de, widget: string, required: false}
      - label: Enquadramento do título
        name: tituloFormato
        widget: object
        collapsed: false
        required: false
        hint: 'Só conta quando há imagem. Tudo é relativo à largura da imagem, para ficar igual em qualquer ecrã'
        fields:
          - label: Posição
            name: ancora
            widget: select
            default: cima-esquerda
            options:
              - {label: Cima à esquerda, value: cima-esquerda}
              - {label: Cima ao centro, value: cima-centro}
              - {label: Cima à direita, value: cima-direita}
              - {label: Meio à esquerda, value: meio-esquerda}
              - {label: Meio ao centro, value: meio-centro}
              - {label: Meio à direita, value: meio-direita}
              - {label: Baixo à esquerda, value: baixo-esquerda}
              - {label: Baixo ao centro, value: baixo-centro}
              - {label: Baixo à direita, value: baixo-direita}
          - {label: Afastamento lateral (%), name: x, widget: number, value_type: int, min: 0, max: 45, default: 5, required: false}
          - {label: Afastamento do topo ou do fundo (%), name: y, widget: number, value_type: int, min: 0, max: 80, default: 16, required: false}
          - label: Largura do bloco (%)
            name: largura
            widget: number
            value_type: int
            min: 15
            max: 95
            default: 52
            required: false
            hint: 'É isto que decide onde o texto muda de linha'
          - label: Tamanho da letra
            name: tamanho
            widget: number
            value_type: float
            min: 2
            max: 14
            step: 0.2
            default: 6
            required: false
            hint: 'Percentagem da largura da imagem. 6 é o normal'
          - label: Alinhamento
            name: alinhar
            widget: select
            default: esquerda
            options: [esquerda, centro, direita]
          - label: Peso
            name: peso
            widget: select
            default: '900'
            options:
              - {label: Normal, value: '400'}
              - {label: Negrito, value: '700'}
              - {label: Muito negrito, value: '900'}
          - label: Entrelinha
            name: entrelinha
            widget: select
            default: apertada
            options: [apertada, normal, solta]
          - label: Espaçamento das letras
            name: espacamento
            widget: select
            default: normal
            options: [apertado, normal, solto]
          - {label: Maiúsculas, name: maiusculas, widget: boolean, default: false, required: false}
          - label: Cor
            name: cor
            widget: select
            default: branco
            options: [branco, preto, laranja]
          - label: Sombra
            name: sombra
            widget: boolean
            default: true
            required: false
