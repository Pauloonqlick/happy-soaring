backend:
  name: github
  repo: Pauloonqlick/happy-soaring
  branch: master
local_backend: true
media_folder: images
# absoluto de propósito: é o caminho que fica escrito no JSON, e um caminho
# relativo deixa de funcionar assim que a página que o lê não estiver na raiz
public_folder: /images
locale: pt
collections:
  - name: settings
    label: Definições gerais
    editor:
      preview: false
    files:
      - name: general
        label: Geral (marca, menu, céu, rodapé, ordem)
        file: content/settings.json
        format: json
        description: Definições globais do site e a ordem dos slides.
        fields:
          - label: Marca
            name: brand
            widget: object
            fields:
              - label: Cor laranja
                name: orange
                widget: color
              - label: Cor preta
                name: black
                widget: color
              - label: Tipo de letra
                name: font
                widget: string
          - label: Vento
            name: wind
            widget: object
            fields:
              - label: Ativar vento
                name: enabled
                widget: boolean
                default: true
              - label: Densidade
                name: density
                widget: number
                value_type: int
                min: 0
                max: 200
                default: 90
          - label: Cores do céu (do topo ao fundo)
            name: sky
            widget: list
            field:
              label: Cor
              name: cor
              widget: color
          - label: Menu
            name: menu
            widget: list
            label_singular: Item
            summary: '{{fields.label.pt}}'
            fields:
              - label: Texto
                name: label
                widget: object
                collapsed: true
                summary: '{{fields.pt}}'
                required: false
                fields:
                  - label: Português
                    name: pt
                    widget: string
                    required: false
                  - label: English
                    name: en
                    widget: string
                    required: false
                  - label: Español
                    name: es
                    widget: string
                    required: false
                  - label: Français
                    name: fr
                    widget: string
                    required: false
                  - label: Deutsch
                    name: de
                    widget: string
                    required: false
              - label: Destino
                name: target
                widget: string
                hint: 'Id da secção (ex: hero, dealer) ou link completo (https://...)'
          - label: Rodapé
            name: footer
            widget: object
            fields:
              - label: Primeira palavra
                name: line1
                widget: object
                collapsed: true
                summary: '{{fields.pt}}'
                required: false
                fields:
                  - label: Português
                    name: pt
                    widget: string
                    required: false
                  - label: English
                    name: en
                    widget: string
                    required: false
                  - label: Español
                    name: es
                    widget: string
                    required: false
                  - label: Français
                    name: fr
                    widget: string
                    required: false
                  - label: Deutsch
                    name: de
                    widget: string
                    required: false
              - label: Símbolo do meio
                name: accent
                widget: string
                default: ×
              - label: Segunda palavra
                name: line2
                widget: object
                collapsed: true
                summary: '{{fields.pt}}'
                required: false
                fields:
                  - label: Português
                    name: pt
                    widget: string
                    required: false
                  - label: English
                    name: en
                    widget: string
                    required: false
                  - label: Español
                    name: es
                    widget: string
                    required: false
                  - label: Français
                    name: fr
                    widget: string
                    required: false
                  - label: Deutsch
                    name: de
                    widget: string
                    required: false
              - label: Nota
                name: note
                widget: object
                collapsed: true
                summary: '{{fields.pt}}'
                required: false
                fields:
                  - label: Português
                    name: pt
                    widget: string
                    required: false
                  - label: English
                    name: en
                    widget: string
                    required: false
                  - label: Español
                    name: es
                    widget: string
                    required: false
                  - label: Français
                    name: fr
                    widget: string
                    required: false
                  - label: Deutsch
                    name: de
                    widget: string
                    required: false
          - label: Idiomas (códigos)
            name: locales
            widget: list
            required: false
            hint: 'Ex: pt, en, es, fr, de'
            field:
              label: Código
              name: code
              widget: string
          - label: Ordem dos slides
            name: slides
            widget: list
            hint: Arrasta para reordenar os slides no site. Para adicionar, escolhe um slide da lista.
            field:
              label: Slide
              name: slide
              widget: relation
              collection: slides
              value_field: id
              search_fields:
                - id
              display_fields:
                - id
          - label: Avisos (por ordem de prioridade)
            name: avisos
            widget: list
            required: false
            hint: 'Só os avisos nesta lista são carregados. Só aparece um de cada vez — o primeiro que estiver dentro das datas'
            field:
              label: Aviso
              name: aviso
              widget: relation
              collection: avisos
              value_field: id
              search_fields:
                - id
                - nome
              display_fields:
                - nome
  - name: slides
    label: Slides
    editor:
      preview: false
    folder: content/slides
    format: json
    identifier_field: id
    slug: '{{fields.id}}'
    create: true
    summary: '{{fields.nome}}'
    fields:
      - label: Identificador
        name: id
        widget: string
        hint: 'Usado nas âncoras do menu (ex: hero, dealer)'
      - label: Nome (para te orientares)
        name: nome
        widget: string
        required: false
        hint: Só para veres na lista do CMS. O que aparece no site é o texto do menu.
      - label: Mostrar secção
        name: visible
        widget: boolean
        default: true
        hint: Desliga para esconder esta secção inteira no site, sem a apagar
      - label: Animação de vento neste slide
        name: wind
        widget: boolean
        default: true
        required: false
        hint: Liga/desliga as linhas de vento enquanto este slide está visível. A animação global tem de estar ligada nas Definições gerais.
      - label: Altura (nº de ecrãs)
        name: heightScreens
        widget: number
        value_type: int
        min: 1
        max: 3
        default: 1
        required: false
        hint: 1 = altura normal (um ecrã) · 2 = ocupa dois ecrãs de altura · 3 = três. Mais alto = mais espaço a preencher
      - label: Fundo especial da apresentação
        name: heroScrim
        widget: boolean
        default: false
        required: false
      - label: Foto de fundo (opcional)
        name: bgImage
        widget: image
        required: false
        hint: Foto a preto-e-branco com tom azul da marca por cima, para se fundir com o céu
      - label: Foto de fundo — mobile (opcional)
        name: bgImageMobile
        widget: image
        required: false
        hint: Se vazio, usa a mesma foto de desktop
      - label: Mostrar foto de fundo
        name: bgImageVisible
        widget: boolean
        default: true
        required: false
        hint: Desliga para esconder a foto sem a apagar — a secção fica só com o fundo azul liso
      - label: Escurecer fundo (%)
        name: bgDarken
        widget: number
        value_type: int
        min: 0
        max: 100
        default: 0
        required: false
        hint: Escurece a foto de fundo. Útil para igualar o tom do azul entre secções com fotos de brilho diferente
      - label: Cor no topo da secção (opcional)
        name: topTint
        widget: color
        required: false
        hint: Funde com o fundo da secção anterior — desvanece para transparente
      - label: Camada azul (tom da secção)
        name: overlay
        widget: object
        collapsed: true
        summary: Camada azul
        required: false
        fields:
          - label: Mostrar camada (liga/desliga)
            name: visible
            widget: boolean
            default: true
            hint: Liga/desliga TODO o tom azul desta secção. Em secções com foto afeta a foto+scrim; nas outras é um véu sobre o céu
          - label: Cor
            name: color
            widget: color
            required: false
            hint: Cor principal do tom (aplica-se à foto/céu e ao scrim)
          - label: Segunda cor (degradé)
            name: color2
            widget: color
            required: false
            hint: Cor no fundo do degradé sobre a foto. Vazio = igual à cor principal
          - label: Intensidade (%)
            name: intensity
            widget: number
            value_type: int
            min: 0
            max: 100
            default: 100
            hint: Força do tom azul (100 = como está agora)
      - label: Mostrar texto de scroll
        name: scrollHintVisible
        widget: boolean
        default: true
        hint: Desliga para esconder o texto e a seta (↓) juntos
      - label: Texto de scroll (opcional)
        name: scrollHint
        widget: object
        collapsed: true
        summary: '{{fields.pt}}'
        required: false
        fields:
          - label: Português
            name: pt
            widget: string
            required: false
          - label: English
            name: en
            widget: string
            required: false
          - label: Español
            name: es
            widget: string
            required: false
          - label: Français
            name: fr
            widget: string
            required: false
          - label: Deutsch
            name: de
            widget: string
            required: false
      - label: Elementos
        name: elements
        widget: list
        label_singular: Elemento
        typeKey: role
        types:
          - label: Texto
            name: text
            widget: object
            summary: Texto — {{fields.title.pt}}
            fields:
              - label: Alinhamento horizontal
                name: align
                widget: select
                default: left
                options:
                  - label: Esquerda
                    value: left
                  - label: Centro
                    value: center
                  - label: Direita
                    value: right
              - label: Alinhamento vertical
                name: valign
                widget: select
                default: center
                options:
                  - label: Cima
                    value: top
                  - label: Centro
                    value: center
                  - label: Baixo
                    value: bottom
              - label: Etiqueta pequena
                name: kicker
                widget: object
                collapsed: true
                summary: '{{fields.pt}}'
                required: false
                fields:
