                    name: pt
                    widget: string
                    required: false
                  - label: English
                    name: en
                    widget: string
                    required: false
                  - label: Español
                    name: es
                    widget: string
                    required: false
                  - label: Français
                    name: fr
                    widget: string
                    required: false
                  - label: Deutsch
                    name: de
                    widget: string
                    required: false
              - label: Título
                name: title
                widget: object
                collapsed: true
                summary: '{{fields.pt}}'
                required: false
