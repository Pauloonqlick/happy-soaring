# MÓDULO DE INTELIGÊNCIA HAPPY SOARING — Worker próprio, separado do site público.
# O site continua estático no Cloudflare Pages; este Worker só apanha
# happysoaring.com/inteligencia e o que está por baixo.
#
# NUNCA vai para a publicação do site: `inteligencia` está nas PROIBIDAS
# do scripts/publicar.mjs. Publica-se só com inteligencia/scripts/publicar.mjs.

name = "hs-inteligencia"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Sem endereço público fora do domínio: só a rota abaixo, atrás do Access.
workers_dev = false
preview_urls = false

# Duas rotas e não um prefixo solto: `happysoaring.com/inteligencia*`
# apanharia também /inteligencia-qualquer-coisa.
routes = [
  { pattern = "happysoaring.com/inteligencia", zone_name = "happysoaring.com" },
  { pattern = "happysoaring.com/inteligencia/*", zone_name = "happysoaring.com" }
]

# A interface. `run_worker_first`: nenhum ficheiro é servido sem passar
# primeiro pela validação do Access no Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
# Da aplicação «Inteligência Happy Soaring» no Cloudflare Access.
# Se ficarem vazios, o Worker recusa tudo (503). Não são segredos.
ACCESS_TEAM_DOMAIN = "mute-dew-b6a7.cloudflareaccess.com"
ACCESS_AUD = "2fa41478a76ca8317e214e3ba17eb2b7d7e218fbce8da6a76bedc9af784335ad"
EMAILS_AUTORIZADOS = "paulo.pereira@happysoaring.com"
# Publicações do site: lidas pela API de Deployments do Pages.
# O token (só leitura do Pages) é um SEGREDO — CF_API_TOKEN_PAGES — e nunca vive aqui.
CF_ACCOUNT_ID = "50cc980221a29087fe0413f4bf9cbbb1"
CF_PAGES_PROJECT = "happy-soaring"
# Search Console: a propriedade de domínio. As credenciais Google são SEGREDOS
# (GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GSC_REFRESH_TOKEN) e nunca vivem aqui.
GSC_PROPRIEDADE = "sc-domain:happysoaring.com"
# Avisos críticos por email, enviados pelo Resend a partir de um subdomínio próprio
# (o email Google do domínio principal não é tocado). A chave é um SEGREDO —
# RESEND_API_KEY — e nunca vive aqui. Sem ela, nenhum aviso é enviado.
AVISOS_DE = "Inteligência Happy Soaring <alertas@avisos.happysoaring.com>"
AVISOS_PARA = "paulo.pereira@happysoaring.com"

# UMA tarefa agendada, gratuita: o plano Free tem 5 por conta, partilhadas.
# De 2 em 2 minutos avança a observação das publicações, dentro dos limites
# de 50 pedidos e 50 consultas por execução. Não chama nenhum serviço pago.
[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hs-inteligencia"
database_id = "a88ddcd6-25bf-4ef1-ba44-9fc12cdde39b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BRUTO"
bucket_name = "hs-inteligencia-bruto"
