# MÓDULO DE INTELIGÊNCIA HAPPY SOARING — Worker próprio, separado do site público.
# O site continua estático no Cloudflare Pages; este Worker só apanha
# happysoaring.com/inteligencia e o que está por baixo.
#
# NUNCA vai para a publicação do site: `inteligencia` está nas PROIBIDAS
# do scripts/publicar.mjs. Publica-se só com inteligencia/scripts/publicar.mjs.

name = "hs-inteligencia"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Sem endereço público fora do domínio: só a rota abaixo, atrás do Access.
workers_dev = false
preview_urls = false

# Duas rotas e não um prefixo solto: `happysoaring.com/inteligencia*`
# apanharia também /inteligencia-qualquer-coisa.
routes = [
  { pattern = "happysoaring.com/inteligencia", zone_name = "happysoaring.com" },
  { pattern = "happysoaring.com/inteligencia/*", zone_name = "happysoaring.com" }
]

# A interface. `run_worker_first`: nenhum ficheiro é servido sem passar
# primeiro pela validação do Access no Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
# Da aplicação «Inteligência Happy Soaring» no Cloudflare Access.
# Se ficarem vazios, o Worker recusa tudo (503). Não são segredos.
ACCESS_TEAM_DOMAIN = "mute-dew-b6a7.cloudflareaccess.com"
ACCESS_AUD = "2fa41478a76ca8317e214e3ba17eb2b7d7e218fbce8da6a76bedc9af784335ad"
EMAILS_AUTORIZADOS = "paulo.pereira@happysoaring.com"

[[d1_databases]]
binding = "DB"
database_name = "hs-inteligencia"
database_id = "a88ddcd6-25bf-4ef1-ba44-9fc12cdde39b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BRUTO"
bucket_name = "hs-inteligencia-bruto"
