<meta property="og:image:width" content="1200" />

<!-- Só factos que estão no site. Nada de moradas, telefones, avaliações,
     preços ou certificações inventadas: dados estruturados que não
     correspondem ao que se vê na página são penalizados, e com razão. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://happysoaring.com/#organizacao",
      "name": "Happy Soaring",
      "url": "https://happysoaring.com/",
      "description": "Revendedor oficial Flow Paragliders em Portugal e cursos de parakite.",
      "areaServed": { "@type": "Country", "name": "Portugal" },
      "knowsLanguage": ["pt", "en", "es", "fr", "de"]
    },
    {
      "@type": "WebSite",
      "@id": "https://happysoaring.com/#site",
      "url": "https://happysoaring.com/",
      "name": "Happy Soaring",
      "publisher": { "@id": "https://happysoaring.com/#organizacao" },
      "inLanguage": ["pt", "en", "es", "fr", "de"]
    }
  ]
}
</script>
</head>
<body>
<div class="sky"></div>
<canvas id="wind"></canvas>
<main id="app"></main>
<!-- módulo, para poder partilhar as regras dos avisos com o gerador
     das páginas das asas. O app.js não escreve nenhuma variável global e não
     há handlers inline no HTML, por isso a mudança de âmbito não parte nada. -->
<script type="module" src="app.js"></script>
